# Local development database for zero-key mode. No cloud services.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relicon
      POSTGRES_PASSWORD: relicon
      POSTGRES_DB: relicon
    ports:
      - "55432:5432"
    volumes:
      - relicon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relicon"]
      interval: 2s
      retries: 30
volumes:
  relicon_pg:
