[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relicon"
version = "0.2.0"
description = "Self-improving ad engine: Creative Genome, generation pipeline, simulated market, learning loop"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
legacy = ["openai>=1.30"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
relicon = "relicon.cli:main"

[tool.setuptools.packages.find]
include = ["relicon*"]

[tool.setuptools.package-data]
relicon = ["simulator/scenarios/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = ["integration: full zero-key loop"]
